[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biyou-backend"
version = "0.1.0"
description = "BiYou local document Q&A backend"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "lancedb>=0.25,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "loguru>=0.7.3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
